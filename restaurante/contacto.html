<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Tu Nombre">
    <meta name="description" content="Formulario de contacto para enviar un mensaje.">
    <meta name="keywords" content="contacto, mensaje, formulario, enviar">
    <title>Envíenos su mensaje</title>
</head>
<body>

    <header>
        <h2>Envíenos su mensaje</h2>
        <button type="button" aria-label="Cerrar ventana">X</button>
    </header>

    <main>
        <form action="#" method="post">
            
            <p>
                <input type="text" id="nombre" name="nombre" placeholder="Su nombre" aria-label="Su nombre" required>
                <input type="email" id="email" name="email" placeholder="Su correo electrónico" aria-label="Su correo electrónico" required>
                <input type="tel" id="telefono" name="telefono" placeholder="su teléfono" aria-label="Su teléfono">
            </p>

            <p>
                <input type="text" id="asunto" name="asunto" placeholder="Asunto" aria-label="Asunto" required>
            </p>

            <p>
                <textarea id="mensaje" name="mensaje" placeholder="Su mensaje" aria-label="Su mensaje" rows="6" cols="50" maxlength="500" required></textarea>
                <br>
                <p>0 / 500</p>
            </p>

            <p>
                <button type="submit">ENVIAR</button>
            </p>

        </form>
    </main>

    <footer>
                <a href="index.html" > Volver al restaurante</a>

                
    </footer>
</body>
</html>
