
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Fabián Guerrero Gallego">
    <meta name="description" content="Formulario de reseña de platos del restaurante">
    <meta name="keywords" content="restaurante, reseña, formulario, platos, opinión">
    <title>Reseña de Platos</title>
</head>
<body>
    <header>
        <h1>Deja tu reseña</h1>
    </header>

    <nav>
    </nav>

    <main>
        <h2>Formulario de reseña de un plato</h2>
        <form action="#" method="POST">
            <p>
                <label for="nombre">Nombre del que realiza la reseña:</label><br>
                <input type="text" id="nombre" name="nombre" required>
            </p>

            <p>
                <label for="plato">Elige el plato a reseñar:</label><br>
                <select id="plato" name="plato" required>
                    <option value="">-- Selecciona uno de nuestros 3 platos --</option>
                    <option value="plato1">Macarrones con Tomate</option>
                    <option value="plato2">Filete con Patatas</option>
                    <option value="plato3">Tarta de Queso</option>
                </select>
            </p>

            <p>
                <label for="resena">Escribe aquí la reseña del plato:</label><br>
                <textarea id="resena" name="resena" rows="6" cols="50" required></textarea>
            </p>

            <p>
                <button type="submit">Enviar reseña</button>
            </p>
        </form>
    </main>

    <footer>
        <p> 2026 Fabián Guerrero Gallego. Todos los derechos reservados.</p>
        <a href="index.html">Volver a la página principal del restaurante</a>

    </footer>
</body>
</html>
