<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Autor">
    <meta name="description" content="Descripción">
    <meta name="keywords" content="palabras">
    
    
    <link rel="icon" type="image/png" href="restaurante/img/restaurante.png">   <title>Club Amigos de la Informática</title>
</head>
<body>

    <header>
        <h2>Rellena el siguiente cuestionario para formar parte del club de "Amigos de la informática"</h2>
    </header>

    <main>
        <form action="#" method="post">

            <!-- Sección de Datos Personales -->
            <fieldset>
                <legend>Datos personales</legend>
                
                <p>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </p>
                
                <p>
                    <label for="domicilio">Domicilio:</label>
                    <input type="text" id="domicilio" name="domicilio" placeholder="&lt;calle, numero y localidad&gt;">
                </p>
                
                <p>
                    <label for="pais">País de origen:</label>
                    <select id="pais" name="pais">
                        <option value="espana">España</option>
                        <!-- Se pueden añadir más países aquí -->
                    </select>
                </p>
                
                <p>
                    <label for="fecha_nac">Fecha de nacimiento:</label>
                    <input type="text" id="fecha_nac" name="fecha_nac" placeholder="dd/mm/aaaa">
                </p>
                
                <p>
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email">
                </p>
                
                <p>
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono">
                </p>
                
                <p>
                    <label>Estado civil:</label>
                    <input type="radio" id="soltero" name="estado_civil" value="soltero">
                    <label for="soltero">Solter@</label>
                    
                    <input type="radio" id="casado" name="estado_civil" value="casado">
                    <label for="casado">Casad@</label>
                    
                    <input type="radio" id="separado" name="estado_civil" value="separado">
                    <label for="separado">Separad@</label>
                    
                    <input type="radio" id="viudo" name="estado_civil" value="viudo">
                    <label for="viudo">Viud@</label>
                </p>
                
                <p>
                    <label>Sexo:</label>
                    <input type="radio" id="hombre" name="sexo" value="hombre">
                    <label for="hombre">Hombre</label>
                    
                    <input type="radio" id="mujer" name="sexo" value="mujer">
                    <label for="mujer">Mujer</label>
                </p>
            </fieldset>

            <!-- Sección de Otra información de interés -->
            <fieldset>
                <legend>Otra información de interés</legend>
                
                <p>
                    <label for="componentes">Seleccione los componentes electrónicos con los que habitualmente trabajas:</label>
                    <select id="componentes" name="componentes[]" multiple size="4">
                        <option value="movil">Móvil</option>
                        <option value="tablet">Tablet</option>
                        <option value="ordenador">Ordenador</option>
                        <option value="ebook">Ebook</option>
                    </select>
                </p>
                
                <p>
                    <label>Seleccione tus actividades favoritas:</label>
                </p>
                <ul>
                    <li>
                        <input type="checkbox" id="deporte" name="actividades" value="deporte">
                        <label for="deporte">Hacer deporte</label>
                    </li>
                    <li>
                        <input type="checkbox" id="salir" name="actividades" value="salir">
                        <label for="salir">Salir con mis amigos</label>
                    </li>
                    <li>
                        <input type="checkbox" id="series" name="actividades" value="series">
                        <label for="series">Ver series, pelis,...</label>
                    </li>
                    <li>
                        <input type="checkbox" id="senderismo" name="actividades" value="senderismo">
                        <label for="senderismo">Realizar rutas de senderismo</label>
                    </li>
                    <li>
                        <input type="checkbox" id="cine" name="actividades" value="cine">
                        <label for="cine">Ir al cine</label>
                    </li>
                    <li>
                        <input type="checkbox" id="musica" name="actividades" value="musica">
                        <label for="musica">Escuchar música</label>
                    </li>
                </ul>
                
                <p>
                    <label for="motivo">Explique brevemente el motivo por el que desea ingresar en nuestro club:</label><br>
                    <textarea id="motivo" name="motivo" rows="4" cols="50"></textarea>
                </p>
                
                <p>
                    <label for="pelicula">Elige o escribe tu peli favorita:</label>
                    <input type="text" id="pelicula" name="pelicula">
                </p>
            </fieldset>


            <p>
                <button type="submit">Enviar</button>
                <button type="button">Cancelar</button>
            </p>

        </form>
    </main>

    <footer>
        <a href="index.html">Volver al menú formularios</a> <br>
    </footer>
</body>
</html>
